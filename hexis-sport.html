<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12232b">
<title>Hexis Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F2EC; --ink:#14181B; --graphite:#5A626B; --hair:#DED9CE;
  --deep:#12232B;            /* bleu instrument, accent principal */
  --deep-2:#1C3A45;
  --signal:#2FA88A;          /* vert mesure, statut "fait" */
  --warn:#C6772F;            /* ambre, "à vérifier" */
  --danger:#B23A48;
  --card:#FBFAF6;
  --shadow:0 1px 0 rgba(20,24,27,.04), 0 8px 24px -18px rgba(18,35,43,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01";}
body{max-width:560px;margin:0 auto;min-height:100dvh}
#app{min-height:100dvh;display:flex;flex-direction:column}
.display{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;line-height:1.05;margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:500}
.num.unknown{color:var(--graphite);position:relative}
.unknown-tag{font-family:Inter,sans-serif;font-size:.5rem;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite);
  border:1px solid var(--hair);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:middle}

/* écrans pleins (migration/vide) */
.screen{flex:1;padding:32px 22px calc(28px + env(safe-area-inset-bottom))}
.screen.center{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:16px;min-height:100dvh}
.brandmark{font-family:Fraunces,serif;font-weight:600;font-size:30px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;
  background:var(--deep);color:#EAF3F0;border-radius:16px;box-shadow:var(--shadow)}
.onb-steps{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--graphite)}
.brandmark.ok{background:var(--signal)}
.screen.center .display{font-size:2.15rem}
.lede{color:var(--graphite);font-size:1.02rem;line-height:1.5;margin:0}
.lede.small{font-size:.92rem}
.steps{margin:6px 0 4px;padding-left:1.1rem;color:var(--ink)}
.steps li{margin:.4rem 0;line-height:1.4}
.checks{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:5px;width:100%}
.checks li{font-size:.86rem;color:var(--graphite)}
.checks li.ok{color:var(--deep-2)} .checks li.ko{color:var(--danger)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin:6px 0}
.stat{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 8px;text-align:center}
.stat-num{font-size:1.3rem}.stat-num .num{font-size:1.3rem}
.stat-label{font-size:.66rem;color:var(--graphite);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.note{font-size:.82rem;color:var(--warn);background:#FBF1E6;border:1px solid #EBD9C4;border-radius:10px;padding:10px 12px;width:100%;margin:4px 0}

/* boutons */
.btn{appearance:none;border:none;border-radius:12px;padding:15px 18px;font-family:Inter;font-size:1rem;font-weight:600;
  cursor:pointer;width:100%;margin-top:8px;transition:transform .06s ease}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--deep);color:#EAF3F0;box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--deep-2);border:1px solid var(--hair)}
.btn.ghost.danger{color:var(--danger);border-color:#E4C4C8}
.btn.small{width:auto;padding:9px 13px;font-size:.85rem;margin:0}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* coquille app */
.main{flex:1;padding:22px 18px 96px;overflow-y:auto}
.hd{margin-bottom:18px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--graphite);margin-bottom:6px}
.hello{font-size:1.9rem}
.screen-title{font-size:1.7rem;margin-bottom:16px}
.sub{font-family:Inter;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--graphite);margin:22px 0 8px}

.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card-eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--graphite);margin-bottom:8px}
.lead-card{background:linear-gradient(160deg,var(--deep),var(--deep-2));border:none;color:#EAF3F0}
.lead-card .card-eyebrow{color:#9BB8B2}
.lead-title{font-family:Fraunces,serif;font-weight:600;font-size:1.7rem;line-height:1.05}
.lead-title.muted{color:#8AA6A0}
.lead-sub{color:#9BB8B2;font-size:.9rem;margin-top:4px}
.card-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-row .card{margin-bottom:0}
.kpi-date{font-family:Fraunces,serif;font-size:1.1rem;font-weight:600}
.kpi-date.muted{color:var(--graphite)}
.kpi-sub{font-size:.76rem;color:var(--graphite);margin-top:4px}
.kpi-pair{display:flex;flex-direction:column;gap:10px}
.kpi-cell-label{font-size:.72rem;color:var(--graphite)}
.kpi-cell-val{font-size:1.25rem;margin-top:2px}.kpi-cell-val .num{font-size:1.25rem}
.app-foot{text-align:center;color:var(--graphite);font-size:.8rem;font-style:italic;margin:26px 12px 4px;line-height:1.5}

/* bannière diagnostic (non bloquante) */
.diag-banner{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;cursor:pointer;
  background:#FBF1E6;border:1px solid #EBD9C4;border-radius:14px;padding:13px 15px;margin-bottom:16px;color:var(--warn)}
.diag-banner b{font-size:.92rem}.diag-banner span{font-size:.78rem;color:#9A7A54}
.diag-banner.warn{background:#F7E9E9;border-color:#E4C4C8;color:var(--danger)}
.diag-banner.warn span{color:#9A5A62}

/* listes */
.list{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:14px 15px}
.list-item:active{background:#F3F1EA}
.li-date{font-family:Fraunces,serif;font-weight:600;font-size:1.02rem;text-transform:capitalize}
.li-sub{font-size:.78rem;color:var(--graphite);margin-top:3px}
.chip{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:20px;background:#EFEDE6;color:var(--graphite)}
.chip.warn{background:#FBF1E6;color:var(--warn)} .chip.ok{background:#E6F3EE;color:var(--signal)}
.empty{color:var(--graphite);text-align:center;padding:40px 0;font-size:.95rem}

/* détail séance */
.back{background:none;border:none;color:var(--deep-2);font-size:.9rem;font-weight:600;padding:0;margin-bottom:14px;cursor:pointer}
.legacy-note{display:flex;flex-direction:column;gap:3px;background:#FBF1E6;border:1px solid #EBD9C4;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.legacy-note b{font-size:.88rem;color:var(--warn)}.legacy-note span{font-size:.76rem;color:#9A7A54}
.ex-card{padding:14px 15px}
.ex-name{font-family:Fraunces,serif;font-weight:600;font-size:1.12rem;margin-bottom:10px}
.set-table{display:flex;flex-direction:column;gap:1px;background:var(--hair);border-radius:9px;overflow:hidden}
.set-row{display:grid;grid-template-columns:56px 1fr 1fr;background:var(--card)}
.set-row.head{background:#F0EEE7}
.set-cell{padding:9px 12px;font-size:.9rem}
.set-row.head .set-cell{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--graphite)}
.set-cell.idx{color:var(--graphite)}
.set-row.unv{background:#FBF6EE}

/* données */
.action-list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.action{text-align:left;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:14px 16px}
.action:active{background:#F3F1EA}
.action-title{font-weight:600;font-size:.98rem}
.action-sub{font-size:.8rem;color:var(--graphite);margin-top:3px;line-height:1.4}

/* tabbar */
.tabbar{position:sticky;bottom:0;display:flex;background:rgba(251,250,246,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--hair);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--graphite)}
.tab.active{color:var(--deep)}
.tab .ti{font-size:1.15rem;line-height:1}
.tab .tl{font-size:.66rem;font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:11px;font-size:.88rem;opacity:0;transition:all .3s ease;z-index:50;pointer-events:none;max-width:88%}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}

/* saisie texte / prénom */
.text-input{width:100%;padding:13px 15px;border:1px solid var(--hair);border-radius:12px;background:var(--card);
  font-family:Inter;font-size:1rem;color:var(--ink);margin-top:8px}
.small-input{width:auto;flex:1;min-width:0}
.mini-form{display:flex;gap:8px;align-items:stretch;margin-top:4px}
.mini-form .btn.small{margin-top:8px;white-space:nowrap}

/* mode entraînement */
.ex-top{margin-bottom:10px}
.ex-presc{font-size:.78rem;color:var(--graphite);margin-top:3px}
.log-row{display:grid;grid-template-columns:38px 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.log-idx{font-family:"IBM Plex Mono",monospace;color:var(--graphite);font-size:.85rem}
.log-cell{position:relative;display:flex;align-items:center}
.log-input{width:100%;padding:12px 40px 12px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--paper);
  font-family:"IBM Plex Mono",monospace;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.log-unit{position:absolute;right:10px;font-size:.7rem;color:var(--graphite);pointer-events:none}
.log-rest{font-size:.72rem;color:var(--signal);white-space:nowrap}
.link-btn{background:none;border:none;color:var(--deep-2);font-weight:600;font-size:.85rem;padding:4px 0;cursor:pointer}
.add-ex{display:flex;flex-direction:column;gap:8px}
.add-ex .btn.small{margin-top:2px}
.set-table.has-rest .set-row{grid-template-columns:46px 1fr 1fr 1fr}

/* proposition appliquer à toutes les séries */
.apply-prompt{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:10px;
  background:var(--deep);color:#EAF3F0;padding:14px 16px;border-radius:14px;font-size:.9rem;max-width:92%;width:340px;box-shadow:0 10px 30px -8px rgba(18,35,43,.6)}
.ap-msg{line-height:1.4}
.ap-btns{display:flex;gap:8px}
.ap-yes,.ap-no{border:none;border-radius:9px;padding:9px 12px;font-weight:600;font-size:.84rem;cursor:pointer;flex:1}
.ap-yes{background:var(--signal);color:#0A241C}.ap-no{background:rgba(255,255,255,.12);color:#EAF3F0}
.log-head .log-h{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--graphite);text-align:center}
.log-head{margin-bottom:4px}
.date-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.date-label{font-size:.8rem;color:var(--graphite)}
.date-input{padding:9px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--card);font-family:Inter;font-size:.92rem;color:var(--ink)}
.log-row.editable{grid-template-columns:34px 1fr 1fr 1fr 28px}
.set-del{background:none;border:none;color:var(--danger);font-size:1.2rem;cursor:pointer;padding:0;line-height:1}

/* chrono de récupération */
.rest-bar{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:55;display:flex;align-items:center;gap:14px;
  background:var(--deep-2);color:#EAF3F0;padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);max-width:94%}
.rest-time{font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:600;min-width:96px}
.rest-ctrl{display:flex;gap:6px}
.rest-btn{background:rgba(255,255,255,.12);border:none;color:#EAF3F0;border-radius:8px;padding:7px 11px;font-size:.82rem;font-weight:600;cursor:pointer}
.rest-btn.done{background:var(--signal);color:#0A241C}
.ex-name-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rest-start{background:var(--deep);color:#EAF3F0;border:none;border-radius:9px;padding:7px 12px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.err-msg{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--danger);background:#F7E9E9;border:1px solid #E4C4C8;border-radius:10px;padding:10px 12px;width:100%;word-break:break-word}
</style>

<body>
<div id="app"></div>
<script>
/* =====================================================================
   Carnet-Lamine — Moteur de migration v2 -> v3 (fonctions pures)
   Testable en Node ; destiné à être inliné tel quel dans la v1.2 HTML.
   Aucune dépendance externe. Aucun accès localStorage ici.
   ===================================================================== */
(function (root) {
  'use strict';

  // --- Générateur d'ID -------------------------------------------------
  // Dans l'app : crypto.randomUUID() (contexte HTTPS) avec ce fallback.
  // En test : on force un compteur déterministe pour des artefacts lisibles.
  function makeIdFactory(deterministic) {
    let n = 0;
    return function (prefix) {
      if (deterministic) { n += 1; return prefix + '_' + String(n).padStart(4, '0'); }
      if (root.crypto && root.crypto.randomUUID) return prefix + '_' + root.crypto.randomUUID();
      return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    };
  }

  // --- Normalisation de nom (matching uniquement, jamais un id) --------
  function normalizeName(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlève accents
      .replace(/[-_/]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // --- Parseur numérique tolérant au format français ------------------
  // Renvoie { value:number|null, raw:any, status }
  function parseNumberFR(raw) {
    if (raw === null || raw === undefined || raw === '') return { value: null, raw: raw, status: 'absent' };
    if (typeof raw === 'number') return Number.isFinite(raw) ? { value: raw, raw: raw, status: 'clean-number' } : { value: null, raw: raw, status: 'invalid' };
    let s = String(raw).trim().replace(/\u00a0/g, ' '); // espace insécable -> espace
    const trimmed = s !== String(raw);
    let status = 'clean-number';
    let hadComma = false;
    // séparateur de milliers "1 000" -> "1000"
    if (/^\d{1,3}(\s\d{3})+([.,]\d+)?$/.test(s)) { s = s.replace(/\s/g, ''); status = 'normalized-thousands'; }
    // virgule décimale française "35,5" -> "35.5"
    if (/,/.test(s)) { s = s.replace(',', '.'); hadComma = true; }
    const v = Number(s);
    if (!Number.isFinite(v)) return { value: null, raw: raw, status: 'invalid' };
    if (hadComma) status = 'normalized-decimal-comma';
    else if (trimmed && status === 'clean-number') status = 'trimmed';
    return { value: v, raw: raw, status: status };
  }

  // --- Parseur de repos "2 min" / "90 sec" / "60s" --------------------
  function parseRest(label) {
    const out = { restSeconds: null, legacyRestLabel: (label == null ? null : String(label)) };
    if (label == null) return out;
    const s = String(label).toLowerCase().replace(/\u00a0/g, ' ').trim();
    let m;
    if ((m = s.match(/^(\d+)\s*min(?:\s*(\d+)\s*s(?:ec)?)?$/))) { out.restSeconds = parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0); return out; }
    if ((m = s.match(/^(\d+)\s*s(?:ec)?$/))) { out.restSeconds = parseInt(m[1], 10); return out; }
    if ((m = s.match(/^(\d+)$/))) { out.restSeconds = parseInt(m[1], 10); return out; } // nombre nu = secondes
    return out; // format non reconnu : restSeconds null, label brut conservé
  }

  // --- Détection du schéma v2 (ne pas se fier à schemaVersion seul) ----
  function detectSchemaVersion(data) {
    if (!data || typeof data !== 'object') return 'unknown';
    if (data.exportFormat === 'carnet-lamine' && data.schemaVersion === 3) return 3;
    if (data.schemaVersion === 3 || (data.meta && data.meta.schemaVersion === 3)) return 3;
    const looksV2 = Array.isArray(data.checkins) && data.exercises &&
      (Array.isArray(data.exercises.A) || Array.isArray(data.exercises.B));
    if (looksV2) return 2;
    if (data.schemaVersion === 2) return 2;
    return 'unknown';
  }

  // --- Normalise un historique v2 vers { date, sets:[{charge,reps}] } --
  function normalizeHistoryEntry(h) {
    if (h && Array.isArray(h.sets)) return { date: h.date, sets: h.sets, createdAt: h.createdAt || null };
    if (h && (h.charge !== undefined || h.reps !== undefined)) // ancien format {date,charge,reps}
      return { date: h.date, sets: [{ charge: h.charge, reps: h.reps }], createdAt: h.createdAt || null };
    return { date: h && h.date, sets: [], createdAt: (h && h.createdAt) || null };
  }

  // =====================================================================
  //  MIGRATION PRINCIPALE
  // =====================================================================
  function migrateV2toV3(v2, opts) {
    opts = opts || {};
    const now = opts.now || new Date().toISOString();
    const deviceId = opts.deviceId || 'dev_test';
    const genId = makeIdFactory(opts.deterministicIds);
    const appVersion = '1.2.0';

    const log = []; let seq = 0;
    function record(type, payload) { seq += 1; log.push(Object.assign({ sequence: seq, timestamp: now, type: type, status: 'success' }, payload)); }

    const base = () => ({ createdAt: null, updatedAt: null, migratedAt: now, deviceId: deviceId, syncStatus: 'local', userId: null, source: 'legacy-v2' });

    const dataset = {
      meta: { schemaVersion: 3, appVersion: appVersion, deviceId: deviceId },
      exercises: [], workoutTemplates: [], workoutSessions: [], plannedEvents: [],
      bodyMeasurements: [], cardioSessions: [], weeklyReviews: [], settings: { deviceId: deviceId },
      migrationLog: null
    };
    const reviewItems = []; // migrationReviewItems (hors workoutSessions)

    // ---- 1) Bibliothèque d'exercices + modèles A/B --------------------
    const libByNorm = {}; // normalizedName -> exercise
    const legacyExMap = {}; // group -> legacyId -> exerciseId (pour relier histories)
    const templates = {};

    ['A', 'B'].forEach(function (group) {
      const arr = (v2.exercises && Array.isArray(v2.exercises[group])) ? v2.exercises[group] : [];
      if (!v2.exercises || !Array.isArray(v2.exercises[group])) record('group-absent', { group: group, warnings: ['Tableau ' + group + ' absent'] });
      legacyExMap[group] = {};
      const tpl = { id: genId('tpl'), name: 'Séance ' + group, version: 1, source: 'legacy-v2', items: [], createdAt: null, updatedAt: null, migratedAt: now, deviceId: deviceId, syncStatus: 'local', userId: null };
      templates[group] = tpl;
      dataset.workoutTemplates.push(tpl);

      arr.forEach(function (ex, idx) {
        const norm = normalizeName(ex.name);
        const objNorm = normalizeName(ex.objectif);
        let lib = libByNorm[norm];
        if (!lib) {
          lib = Object.assign(base(), {
            id: genId('ex'), name: ex.name, normalizedName: norm,
            aliases: ex.name ? [ex.name] : [], objective: ex.objectif || null, machine: null,
            defaultTip: ex.tip || '',
            migrationInfo: { legacyEntries: [], legacyPr: [], mergeConfidence: 'single-source' }
          });
          libByNorm[norm] = lib;
          dataset.exercises.push(lib);
        } else {
          // Fusion : objectif divergent => on fusionne mais on signale.
          if (objNorm && normalizeName(lib.objective) && objNorm !== normalizeName(lib.objective)) {
            lib.migrationInfo.mergeConfidence = 'needs-review';
            lib.migrationInfo.objectiveVariants = Array.from(new Set([].concat(lib.migrationInfo.objectiveVariants || [lib.objective], [ex.objectif]).filter(Boolean)));
            record('exercise-merge', { legacyEntries: lib.migrationInfo.legacyEntries.concat([{ group: group, id: ex.id }]), newExerciseId: lib.id, reason: 'normalized-name-match', mergeConfidence: 'needs-review', warnings: ['Objectifs divergents : ' + lib.migrationInfo.objectiveVariants.join(' / ')] });
          } else {
            if (lib.migrationInfo.mergeConfidence === 'single-source') lib.migrationInfo.mergeConfidence = 'exact-normalized-match';
            record('exercise-merge', { legacyEntries: lib.migrationInfo.legacyEntries.concat([{ group: group, id: ex.id }]), newExerciseId: lib.id, reason: 'exact-normalized-match', mergeConfidence: 'exact-normalized-match' });
          }
          if (ex.name && lib.aliases.indexOf(ex.name) === -1) lib.aliases.push(ex.name);
          if (!lib.defaultTip && ex.tip) lib.defaultTip = ex.tip;
        }
        lib.migrationInfo.legacyEntries.push({ group: group, id: ex.id != null ? ex.id : ('idx' + idx) });
        if (ex.pr && (ex.pr.charge != null)) lib.migrationInfo.legacyPr.push({ group: group, charge: ex.pr.charge, date: ex.pr.date || null });
        legacyExMap[group][ex.id != null ? ex.id : ('idx' + idx)] = lib.id;

        // item de modèle
        const rest = parseRest(ex.repos);

  // ---- Filet de sécurité : jamais de page blanche -------------------
  function renderError(e, where) {

  // ---- Flux de migration --------------------------------------------

  // ---- Coquille app + navigation ------------------------------------

  function banner(main) {

    var main = document.getElementById('main'); clear(main);
    var back = el('button', 'back', '‹ Annuler'); back.onclick = function () { sessionDetail(id); }; main.appendChild(back);
    main.appendChild(el('h1', 'display screen-title', 'Modifier la séance'));
    var drow = el('div', 'date-row'); drow.appendChild(el('span', 'date-label', 'Date :'));
    var dI = el('input', 'date-input'); dI.type = 'date'; dI.value = working.date || todayISO();
    dI.onchange = function () { working.date = dI.value || working.date; };
    drow.appendChild(dI); main.appendChild(drow);
    working.entries.forEach(function (en) {
      var ex = exById[en.exerciseId];
      var card = el('section', 'card ex-card');
      card.appendChild(el('div', 'ex-name', ex ? ex.name : (en.name || 'Exercice')));
      var head = el('div', 'log-row log-head'); head.appendChild(el('div', 'log-idx', ''));
      ['Charge', 'Rép.', 'Récup', ''].forEach(function (h) { head.appendChild(el('div', 'log-h', h)); });
      card.appendChild(head);
      en.sets.forEach(function (st, si) {
        var row = el('div', 'log-row editable');
        row.appendChild(el('div', 'log-idx', 'S' + (si + 1)));
        row.appendChild(logInput(st.charge, 'kg', function (v) { st.charge = v; }));
        row.appendChild(logInput(st.reps, 'Rép.', function (v) { st.reps = v; }));
        row.appendChild(logInput(st.restSeconds, 's', function (v) { st.restSeconds = v; }));
        var del = el('button', 'set-del', '×'); del.onclick = function () { en.sets.splice(si, 1); sessionEditFrom(id, working); };
        row.appendChild(del); card.appendChild(row);
      });
      var addSet = el('button', 'link-btn', '+ série');
      addSet.onclick = function () { var last = en.sets[en.sets.length - 1] || {}; en.sets.push({ charge: last.charge != null ? last.charge : null, reps: null, restSeconds: last.restSeconds != null ? last.restSeconds : null }); sessionEditFrom(id, working); };
      card.appendChild(addSet);
      main.appendChild(card);
    });
    var save = el('button', 'btn primary', 'Enregistrer les modifications');
    save.onclick = function () { working.entries = working.entries.filter(function (en) { return en.sets.length; }); Object.assign(orig, working); orig.updatedAt = new Date().toISOString(); A.saveWorkoutSession(orig); toast('Modifications enregistrées'); sessionDetail(id); };
    main.appendChild(save);
    var cancel = el('button', 'btn ghost', 'Annuler'); cancel.onclick = function () { sessionDetail(id); }; main.appendChild(cancel);
  }

  // ---- Diagnostic (non bloquant) ------------------------------------
  function viewDiagnostic(main) {
    var back = el('button', 'back', '‹ Accueil'); back.onclick = function () { renderApp('accueil'); }; main.appendChild(back);
    main.appendChild(el('h1', 'display screen-title', 'Vérifier l\'import'));
    main.appendChild(el('p', 'lede small', 'Ces éléments viennent de ton ancien carnet. L\'app ne devine ni l\'heure, ni la durée, ni l\'ordre exact : à toi de confirmer.'));

    var legacy = A.getSessions().filter(function (s) { return s.migrationInfo && s.migrationInfo.requiresReview; });
    var items = A.getMigrationReviewItems().filter(function (x) { return x.status === 'pending'; });
    if (!legacy.length && !items.length) { main.appendChild(el('p', 'empty', 'Tout est vérifié. Rien à faire ici.')); return; }

    if (legacy.length) {
      main.appendChild(el('h2', 'sub', 'Séances à confirmer'));
      var list = el('div', 'list');
      legacy.forEach(function (s) {
        var it = el('button', 'list-item');
        var left = el('div', 'li-left'); left.appendChild(el('div', 'li-date', fmtDate(s.date))); left.appendChild(el('div', 'li-sub', s.entries.length + ' exercice(s)')); it.appendChild(left);
        it.appendChild(el('span', 'chip warn', 'ouvrir'));
        it.onclick = function () { sessionDetail(s.id); };
        list.appendChild(it);
      });
      main.appendChild(list);
    }
    if (items.length) {
      var exById = {}; A.getExercises().forEach(function (e) { exById[e.id] = e; });
      main.appendChild(el('h2', 'sub', 'Charges de départ'));
      main.appendChild(el('p', 'note', 'Ton ancien carnet a noté une charge par machine, sans répétitions. Ce ne sont pas des séances : ce sont tes charges de départ. Confirme-les et elles deviendront le point de repère de chaque exercice.'));
      var all = el('button', 'btn primary', 'Tout accepter comme charges de départ (' + items.length + ')');
      all.onclick = function () { var n = A.acceptAllStartingLoads(); toast(n + ' charge(s) enregistrée(s)'); renderApp('diagnostic'); };
      main.appendChild(all);
      items.forEach(function (x) {
        var ex = exById[x.exerciseId];
        var charge = (x.originalData && x.originalData.sets[0]) ? x.originalData.sets[0].charge : null;
        var card = el('section', 'card');
        card.appendChild(el('div', 'ex-name', ex ? ex.name : 'Exercice'));
        var sub = el('div', 'li-sub'); sub.appendChild(document.createTextNode('Charge de départ : ')); sub.appendChild(num(charge, 'kg')); card.appendChild(sub);
        var row = el('div', 'btn-row');
        var b1 = el('button', 'btn small', 'Confirmer'); b1.onclick = function () { A.resolveMigrationReviewItem(x.id, 'starting-load'); toast((ex ? ex.name : 'Charge') + ' enregistré'); renderApp('diagnostic'); };
        var b2 = el('button', 'btn small ghost', 'Ignorer'); b2.onclick = function () { A.resolveMigrationReviewItem(x.id, 'ignored'); renderApp('diagnostic'); };
        row.appendChild(b1); row.appendChild(b2); card.appendChild(row);
        main.appendChild(card);
      });
    }
  }

  // ---- Données (sauvegardes / export / import / rollback) -----------
  function viewDonnees(main) {
    banner(main);
    main.appendChild(el('h1', 'display screen-title', 'Tes données'));
    main.appendChild(el('p', 'lede small', 'Tes données t\'appartiennent. Exporte-les quand tu veux, dans un format ouvert et lisible.'));

    var d = A.diagnostics();
    var g = el('div', 'stat-grid');
    g.appendChild(stat(Math.round(d.bytesUsed / 1024), 'Ko utilisés'));
    g.appendChild(stat(d.backups, 'sauvegardes'));
    main.appendChild(g);

    var actions = el('div', 'action-list');
    actions.appendChild(action('Exporter (télécharger le fichier)', 'Un fichier JSON complet, à garder en lieu sûr.', exportFlow));
    actions.appendChild(action('Importer une sauvegarde', 'Remplace le carnet actuel. Une sauvegarde est prise avant.', importFlow));
    actions.appendChild(action('Créer une sauvegarde interne', 'Une copie de secours conservée dans l\'app.', function () { A.pushBackup('manuelle'); toast('Sauvegarde créée'); renderApp('donnees'); }));
    main.appendChild(actions);

    // liste sauvegardes
    var bks = A.listBackups();
    if (bks.length) {
      main.appendChild(el('h2', 'sub', 'Sauvegardes internes'));
      var list = el('div', 'list');
      bks.slice().reverse().forEach(function (b) {
        var it = el('button', 'list-item');
        var left = el('div', 'li-left'); left.appendChild(el('div', 'li-date', new Date(b.createdAt).toLocaleString('fr-FR'))); left.appendChild(el('div', 'li-sub', b.reason)); it.appendChild(left);
        it.appendChild(el('span', 'chip', 'restaurer'));
        it.onclick = function () { if (confirm('Restaurer cette sauvegarde ? Le carnet actuel sera d\'abord sauvegardé.')) { A.restoreBackup(b.id); toast('Restauré'); renderApp('accueil'); } };
        list.appendChild(it);
      });
      main.appendChild(list);
    }

    // rollback vers v2 si snapshot présent
    if (d.hasV2Snapshot) {
      main.appendChild(el('h2', 'sub', 'Ancien carnet'));
      var rb = el('button', 'btn ghost danger', 'Revenir à l\'ancien carnet (v2)');
      rb.onclick = function () { if (confirm('Revenir à ton ancien carnet ? Tes données v3 actuelles seront sauvegardées avant.')) { A.rollbackToLegacyV2(); toast('Retour à l\'ancien carnet'); boot(); } };
      main.appendChild(rb);
    }
  }
  function action(title, sub, fn) { var b = el('button', 'action'); b.appendChild(el('div', 'action-title', title)); b.appendChild(el('div', 'action-sub', sub)); b.onclick = fn; return b; }

  function exportFlow() {
    var data = A.exportAll();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    a.href = url; a.download = 'carnet-lamine-' + stamp + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('Fichier exporté');
  }
  function importFlow() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var json; try { json = JSON.parse(rd.result); } catch (e) { return toast('Fichier illisible'); }
        var r = A.importAny(json);
        if (r && (r.ok || r.datasetId)) { toast('Import réussi'); boot(); }
        else toast('Format non reconnu');
      };
      rd.readAsText(f);
    };
    inp.click();
  }

  // ===================================================================
  //  MODE ENTRAÎNEMENT (v1.3)
  // ===================================================================


  function viewSeance(main) {
    var draft = A.getDraft();
    if (!draft) return seanceStart(main);
    seanceLog(main, draft);
  }

  // -- Choisir le type de séance --------------------------------------
  function seanceStart(main) {
    main.appendChild(el('h1', 'display screen-title', 'Nouvelle séance'));
    main.appendChild(el('p', 'lede small', 'Choisis une séance de ton programme, ou pars d\'une séance libre. Tu enregistres charge et répétitions série par série, puis tu valides.'));
    var templates = A.getTemplates();
    var list = el('div', 'list');
    templates.forEach(function (t) {
      var b = el('button', 'list-item');
      var left = el('div', 'li-left'); left.appendChild(el('div', 'li-date', t.name)); left.appendChild(el('div', 'li-sub', t.items.length + ' exercice(s)')); b.appendChild(left);
      b.appendChild(el('span', 'chip', 'démarrer'));
      b.onclick = function () { startDraftFromTemplate(t); renderApp('seance'); };
      list.appendChild(b);
    });
    main.appendChild(list);
    var free = el('button', 'btn ghost', 'Séance libre (sans modèle)');
    free.onclick = function () { A.saveDraft({ type: 'libre', templateId: null, date: todayISO(), startedAt: new Date().toISOString(), entries: [] }); renderApp('seance'); };
    main.appendChild(free);
  }

  function startDraftFromTemplate(t) {
    var exById = {}; A.getExercises().forEach(function (e) { exById[e.id] = e; });
    var entries = t.items.map(function (it) {
      var ex = exById[it.exerciseId];
      var charge = ex && ex.startingLoad ? ex.startingLoad.charge : null;
      var nSets = (it.prescription && it.prescription.setsTarget) || 3;
      var sets = [];
      for (var i = 0; i < nSets; i++) sets.push({ charge: charge, reps: null, restSeconds: null });
      return { exerciseId: it.exerciseId, name: ex ? ex.name : 'Exercice', prescriptionSnapshot: Object.assign({}, it.prescription), sets: sets };
    });
    A.saveDraft({ type: t.name, templateId: t.id, date: todayISO(), startedAt: new Date().toISOString(), entries: entries });
  }

  // -- Écran de saisie de la séance en cours --------------------------
  function seanceLog(main, draft) {
    var head = el('header', 'hd');
    head.appendChild(el('div', 'eyebrow', 'Séance en cours'));
    head.appendChild(el('h1', 'display hello', draft.type));
    // date modifiable (permet de noter un jour oublié)
    var drow = el('div', 'date-row');
    drow.appendChild(el('span', 'date-label', 'Date :'));
    var dI = el('input', 'date-input'); dI.type = 'date'; dI.value = draft.date || todayISO();
    dI.onchange = function () { draft.date = dI.value || todayISO(); A.saveDraft(draft); };
    drow.appendChild(dI);
    head.appendChild(drow);
    main.appendChild(head);

    draft.entries.forEach(function (en, ei) {
      var card = el('section', 'card ex-card');
      var top = el('div', 'ex-top');
      top.appendChild(el('div', 'ex-name', en.name));
      top.appendChild(el('div', 'ex-presc', prescLine(en.prescriptionSnapshot)));
      card.appendChild(top);
      // en-têtes de colonnes
      var head = el('div', 'log-row log-head');
      head.appendChild(el('div', 'log-idx', ''));
      head.appendChild(el('div', 'log-h', 'Charge'));
      head.appendChild(el('div', 'log-h', 'Rép.'));
      head.appendChild(el('div', 'log-h', 'Récup'));
      card.appendChild(head);
      // séries
      en.sets.forEach(function (st, si) {
        var row = el('div', 'log-row');
        row.appendChild(el('div', 'log-idx', 'S' + (si + 1)));
        row.appendChild(logInput(st.charge, 'kg', function (v) { st.charge = v; A.saveDraft(draft); maybeApplyAll(en, si, 'charge', v, 'charge'); }));
        row.appendChild(logInput(st.reps, 'Rép.', function (v) { st.reps = v; A.saveDraft(draft); maybeApplyAll(en, si, 'reps', v, 'répétitions'); }));
        row.appendChild(logInput(st.restSeconds, 's', function (v) { st.restSeconds = v; A.saveDraft(draft); maybeApplyAll(en, si, 'restSeconds', v, 'récup'); }));
        card.appendChild(row);
      });
      var addSet = el('button', 'link-btn', '+ série');
      addSet.onclick = function () { var last = en.sets[en.sets.length - 1] || {}; en.sets.push({ charge: last.charge != null ? last.charge : null, reps: null, restSeconds: last.restSeconds != null ? last.restSeconds : null }); A.saveDraft(draft); renderApp('seance'); };
      card.appendChild(addSet);
      main.appendChild(card);
    });

    if (!draft.entries.length) {
      var empty = el('p', 'empty', 'Séance libre : ajoute ton premier exercice ci-dessous (son nom, puis sa charge).');
      main.appendChild(empty);
    }

    // ajouter un exercice
    var addWrap = el('section', 'card add-ex');
    addWrap.appendChild(el('div', 'card-eyebrow', 'Ajouter un exercice'));
    var nameI = el('input', 'text-input'); nameI.type = 'text'; nameI.placeholder = 'Nom de l\'exercice (ex. Développé couché)';
    var chargeI = el('input', 'text-input small-input'); chargeI.type = 'number'; chargeI.inputMode = 'decimal'; chargeI.placeholder = 'Charge kg (optionnel)';
    var addB = el('button', 'btn small', '+ Ajouter à la séance');
    addB.onclick = function () {
      var nm = (nameI.value || '').trim(); if (!nm) { nameI.focus(); return; }
      var ex = A.createExercise(nm, chargeI.value || null);
      draft.entries.push({ exerciseId: ex.id, name: nm, prescriptionSnapshot: { setsTarget: 3, repsTarget: null, restSeconds: 90 }, sets: [ { charge: chargeI.value ? Number(chargeI.value) : null, reps: null, restSeconds: null }, { charge: chargeI.value ? Number(chargeI.value) : null, reps: null, restSeconds: null }, { charge: chargeI.value ? Number(chargeI.value) : null, reps: null, restSeconds: null } ] });
      A.saveDraft(draft); renderApp('seance');
    };
    addWrap.appendChild(nameI); addWrap.appendChild(chargeI); addWrap.appendChild(addB);
    main.appendChild(addWrap);

    // valider / annuler
    var valid = el('button', 'btn primary', 'Valider la séance');
    valid.onclick = function () { validateSession(draft); };
    main.appendChild(valid);
    var cancel = el('button', 'btn ghost danger', 'Abandonner cette séance');
    cancel.onclick = function () { if (confirm('Abandonner la séance en cours ? Rien ne sera enregistré.')) { A.clearDraft(); renderApp('accueil'); } };
    main.appendChild(cancel);


  }

  function prescLine(p) {
    if (!p) return '';
    var parts = [];
    if (p.setsTarget) parts.push(p.setsTarget + ' × ' + (p.repsTarget || '—'));
    if (p.restSeconds != null) parts.push('récup ' + p.restSeconds + ' s');
    return parts.join(' · ');
  }

  // champ de saisie compact (charge ou reps)
  function logInput(val, label, onchange) {
    var wrap = el('div', 'log-cell');
    var inp = el('input', 'log-input'); inp.type = 'number'; inp.inputMode = 'numeric'; inp.placeholder = label;
    if (val != null) inp.value = val;
    inp.onchange = function () { var v = inp.value === '' ? null : Number(inp.value); onchange(v); };
    wrap.appendChild(inp);
    wrap.appendChild(el('span', 'log-unit', label));
    return wrap;
  }

  // proposition "appliquer à toutes les séries" — déclenchée depuis la 1re série
  function maybeApplyAll(en, si, field, v, label) {
    if (v == null || v === '') return;
    if (si !== 0) return;               // on ne propose qu'à partir de la première série
    if (en.sets.length < 2) return;
    var others = en.sets.filter(function (s, i) { return i !== si && (s[field] == null || s[field] === ''); });
    if (!others.length) return;         // rien à remplir
    var unit = field === 'charge' ? ' kg' : (field === 'restSeconds' ? ' s' : '');
    showApplyPrompt('Appliquer ' + v + unit + ' de ' + label + ' à toutes les séries ?', function () {
      en.sets.forEach(function (s) { s[field] = v; });
      var d = A.getDraft(); A.saveDraft(d); renderApp('seance');
    });
  }
  function showApplyPrompt(msg, onAll) {
    var old = document.getElementById('apply-prompt'); if (old) old.remove();
    var bar = el('div', 'apply-prompt'); bar.id = 'apply-prompt';
    bar.appendChild(el('div', 'ap-msg', msg));
    var btns = el('div', 'ap-btns');
    var yes = el('button', 'ap-yes', 'Appliquer à toutes'); yes.onclick = function () { bar.remove(); onAll(); };
    var no = el('button', 'ap-no', 'Seulement cette série'); no.onclick = function () { bar.remove(); };
    btns.appendChild(yes); btns.appendChild(no); bar.appendChild(btns);
    document.body.appendChild(bar);
  }

  // -- Valider la séance : crée une vraie workoutSession --------------
  function validateSession(draft) {
    var hasData = draft.entries.some(function (en) { return en.sets.some(function (s) { return s.reps != null || s.charge != null; }); });
    if (!hasData) { toast('Saisis au moins une série avant de valider'); return; }
    var started = draft.startedAt ? new Date(draft.startedAt) : null;
    var now = new Date();
    var session = {
      date: draft.date, timezone: Intl && Intl.DateTimeFormat ? Intl.DateTimeFormat().resolvedOptions().timeZone : null,
      templateId: draft.templateId, status: 'completed', source: 'user',
      startedAt: draft.startedAt || null, completedAt: now.toISOString(),
      durationSeconds: started ? Math.round((now - started) / 1000) : null,
      entries: draft.entries.map(function (en) {
        return { exerciseId: en.exerciseId, prescriptionSnapshot: en.prescriptionSnapshot, prescriptionSnapshotReconstructed: false,
          sets: en.sets.filter(function (s) { return s.reps != null || s.charge != null; }).map(function (s) { return { charge: s.charge, reps: s.reps, restSeconds: s.restSeconds != null ? s.restSeconds : null, unverified: false }; }) };
      }).filter(function (en) { return en.sets.length; })
    };
    // met à jour la charge de départ de chaque exercice avec la dernière charge saisie
    draft.entries.forEach(function (en) {
      var lastCharge = null; en.sets.forEach(function (s) { if (s.charge != null) lastCharge = s.charge; });
      if (lastCharge != null) { var ex = A.getExercises().filter(function (e) { return e.id === en.exerciseId; })[0]; if (ex) { ex.startingLoad = { charge: lastCharge, date: draft.date, source: 'session' }; A.saveExercise(ex); } }
    });
    A.saveWorkoutSession(session);
    A.clearDraft();
    toast('Séance enregistrée');
    renderApp('historique');
  }

  function _startBoot() { try { boot(); } catch (e) { try { renderError(e, 'démarrage'); } catch (_) {} } }
  if (document.readyState === 'loading') { window.addEventListener('DOMContentLoaded', _startBoot); }
  else { _startBoot(); }
  // Safari : au retour depuis le cache (bfcache), DOMContentLoaded ne refire pas
  window.addEventListener('pageshow', function (e) { if (e && e.persisted) { _startBoot(); } });
})();

</script>
